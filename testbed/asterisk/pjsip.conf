[global]
type=global
user_agent=HoldWorld-Testbed

[udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[loadgen]
type=endpoint
transport=udp
context=from-load
disallow=all
allow=ulaw
aors=loadgen
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[loadgen]
type=aor
max_contacts=100

[loadgen-identify]
type=identify
endpoint=loadgen
match=172.16.0.0/12
match=10.0.0.0/8
